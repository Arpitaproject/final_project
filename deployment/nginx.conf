server {
    listen 80;
    server_name _; # Change this to your domain name or IP if needed

    location = /favicon.ico { access_log off; log_not_found off; }
    
    # Path to static files
    location /static/ {
        alias /home/ubuntu/Face-Mask-Detection/backend/static/;
    }

    # Path to media files (if any)
    location /media/ {
        alias /home/ubuntu/Face-Mask-Detection/backend/media/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
    }
}
