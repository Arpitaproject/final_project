<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detection Records - MaskGuard Analytics</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .gradient-sphere {
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.1) 0%, transparent 70%);
      border-radius: 50%;
      animation: sphereFloat 25s infinite ease-in-out;
    }

    .gradient-sphere:nth-child(1) {
      top: -200px;
      right: -200px;
      background: radial-gradient(circle, rgba(102,126,234,0.2) 0%, transparent 70%);
      animation-delay: 0s;
    }

    .gradient-sphere:nth-child(2) {
      bottom: -300px;
      left: -200px;
      background: radial-gradient(circle, rgba(118,75,162,0.2) 0%, transparent 70%);
      animation-delay: -5s;
    }

    .gradient-sphere:nth-child(3) {
      top: 30%;
      left: 40%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation-delay: -10s;
    }

    @keyframes sphereFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, 30px) scale(1.1); }
      66% { transform: translate(-30px, 60px) scale(0.9); }
    }

    .particles {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: particleDrift 20s infinite linear;
    }

    @keyframes particleDrift {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-100px) translateX(100px);
        opacity: 0;
      }
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 15px 40px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      animation: slideDown 0.5s ease-out;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo i {
      font-size: 2rem;
      animation: rotate 10s infinite linear;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .nav-actions {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      font-size: 1rem;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .download-btn {
      background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
      color: white;
      box-shadow: 0 10px 20px -5px rgba(72, 187, 120, 0.5);
    }

    .download-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 15px 30px -5px rgba(72, 187, 120, 0.7);
    }

    .back-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 10px 20px -5px rgba(102, 126, 234, 0.5);
    }

    .back-btn:hover {
      transform: translateX(-5px) scale(1.05);
      box-shadow: 0 15px 30px -5px rgba(102, 126, 234, 0.7);
    }

    .container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
      position: relative;
      z-index: 10;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
      animation: fadeUp 0.6s ease-out;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.3s;
      animation: cardPop 0.5s ease-out forwards;
      opacity: 0;
      transform: scale(0.9);
    }

    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    .stat-card:nth-child(4) { animation-delay: 0.4s; }

    @keyframes cardPop {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
    }

    .stat-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }

    .stat-icon i {
      font-size: 1.8rem;
      color: white;
    }

    .stat-card h3 {
      color: #718096;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .records-section {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 30px;
      border-radius: 30px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.3);
      animation: fadeUp 0.7s ease-out;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .section-header h2 {
      background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .total-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 25px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1.1rem;
      box-shadow: 0 10px 20px -5px rgba(102, 126, 234, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .search-section {
      margin-bottom: 25px;
      position: relative;
    }

    .search-wrapper {
      position: relative;
      max-width: 400px;
    }

    .search-wrapper i {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0aec0;
      transition: all 0.3s;
      font-size: 1.2rem;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px 16px 55px;
      border: 2px solid rgba(226, 232, 240, 0.6);
      border-radius: 30px;
      font-size: 1rem;
      transition: all 0.3s;
      background: white;
    }

    .search-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      transform: scale(1.02);
    }

    .search-input:focus + i {
      color: #667eea;
      transform: translateY(-50%) scale(1.2);
    }

    .filter-section {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 12px 25px;
      border: 2px solid rgba(102, 126, 234, 0.3);
      background: white;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
      color: #4a5568;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .filter-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(102, 126, 234, 0.2);
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }

    .filter-btn:hover::before {
      width: 200px;
      height: 200px;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: transparent;
      box-shadow: 0 10px 20px -5px #667eea;
    }

    .filter-btn i {
      font-size: 1rem;
    }

    .table-container {
      overflow-x: auto;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .records-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    .records-table th {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 18px 15px;
      text-align: left;
      font-weight: 600;
      color: white;
      font-size: 0.95rem;
      position: relative;
      overflow: hidden;
    }

    .records-table th:first-child {
      border-top-left-radius: 20px;
    }

    .records-table th:last-child {
      border-top-right-radius: 20px;
    }

    .records-table th i {
      margin-right: 8px;
    }

    .records-table td {
      padding: 18px 15px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.5);
      color: #4a5568;
      transition: all 0.3s;
    }

    .records-table tbody tr {
      animation: slideInRow 0.3s ease-out forwards;
      opacity: 0;
      transform: translateX(-10px);
    }

    @keyframes slideInRow {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .records-table tbody tr:hover {
      background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
      transform: scale(1.01) translateX(5px);
      box-shadow: 0 5px 15px -5px rgba(0, 0, 0, 0.2);
    }

    .status-badge {
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      animation: glow 2s infinite;
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 5px currentColor;
      }
      50% {
        box-shadow: 0 0 15px currentColor;
      }
    }

    .status-mask {
      background: linear-gradient(135deg, #c6f6d5 0%, #9ae6b4 100%);
      color: #22543d;
    }

    .status-no-mask {
      background: linear-gradient(135deg, #fed7d7 0%, #feb2b2 100%);
      color: #c53030;
    }

    .confidence-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .confidence-bar {
      width: 80px;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      background: linear-gradient(90deg, #48bb78, #667eea);
      border-radius: 4px;
      transition: width 0.3s;
    }

    .no-records {
      text-align: center;
      padding: 80px 50px;
      color: #718096;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
      border-radius: 20px;
    }

    .no-records i {
      font-size: 4rem;
      margin-bottom: 20px;
      color: #a0aec0;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .loading-spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 4px solid rgba(102, 126, 234, 0.1);
      border-radius: 50%;
      border-top-color: #667eea;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    .page-btn {
      width: 45px;
      height: 45px;
      border: 2px solid rgba(102, 126, 234, 0.3);
      background: white;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-btn:hover:not(.active) {
      background: #667eea;
      color: white;
      transform: translateY(-3px);
    }

    .page-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: transparent;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      animation: modalPop 0.3s ease-out;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-content i {
      font-size: 4rem;
      color: #48bb78;
      margin-bottom: 20px;
    }

    .modal-content h3 {
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    .modal-close {
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="animated-bg">
    <div class="gradient-sphere"></div>
    <div class="gradient-sphere"></div>
    <div class="gradient-sphere"></div>
  </div>

  <div class="particles" id="particles"></div>

  <div class="navbar">
    <div class="logo">
      <i class="fas fa-database"></i> Records Hub
    </div>
    <div class="nav-actions">
      <button class="btn download-btn" onclick="showExportModal()">
        <i class="fas fa-download"></i> Export CSV
      </button>
      <button class="btn back-btn" onclick="location.href='/dashboard/'">
        <i class="fas fa-arrow-left"></i> Dashboard
      </button>
    </div>
  </div>

  <div class="container">
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-chart-line"></i>
        </div>
        <h3>Total Records</h3>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-check-circle"></i>
        </div>
        <h3>Mask Detected</h3>
        <div class="stat-value" id="statMask">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h3>No Mask</h3>
        <div class="stat-value" id="statNoMask">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <i class="fas fa-percentage"></i>
        </div>
        <h3>Compliance</h3>
        <div class="stat-value" id="statCompliance">0%</div>
      </div>
    </div>

    <div class="records-section">
      <div class="section-header">
        <h2>
          <i class="fas fa-history"></i> Detection History
        </h2>
        <div class="total-badge" id="totalCount">
          <i class="fas fa-chart-pie"></i> 0 Records
        </div>
      </div>

      <div class="search-section">
        <div class="search-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" class="search-input" id="searchInput" placeholder="Search by ID, status, or user...">
        </div>
      </div>

      <div class="filter-section">
        <button class="filter-btn active" data-filter="all">
          <i class="fas fa-globe"></i> All Records
        </button>
        <button class="filter-btn" data-filter="mask">
          <i class="fas fa-check-circle"></i> Mask Detected
        </button>
        <button class="filter-btn" data-filter="no_mask">
          <i class="fas fa-exclamation-triangle"></i> No Mask
        </button>
        <button class="filter-btn" data-filter="today">
          <i class="fas fa-calendar-day"></i> Today
        </button>
        <button class="filter-btn" data-filter="week">
          <i class="fas fa-calendar-week"></i> This Week
        </button>
      </div>

      <div class="table-container">
        <table class="records-table" id="recordsTable">
          <thead>
            <tr>
              <th><i class="fas fa-hashtag"></i> ID</th>
              <th><i class="fas fa-clock"></i> Timestamp</th>
              <th><i class="fas fa-tag"></i> Status</th>
              <th><i class="fas fa-chart-bar"></i> Confidence</th>
              <th><i class="fas fa-user"></i> User</th>
            </tr>
          </thead>
          <tbody id="recordsBody">
            <tr>
              <td colspan="5" class="no-records">
                <div class="loading-spinner"></div>
                <p>Loading records...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div class="modal-overlay" id="exportModal">
    <div class="modal-content">
      <i class="fas fa-file-csv"></i>
      <h3>Export Records</h3>
      <p>Your export is being prepared. This may take a moment...</p>
      <div class="loading-spinner" style="margin: 20px auto;"></div>
      <button class="modal-close" onclick="closeExportModal()">Cancel</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://config-d2d6.onrender.com/api';
    let allRecords = [];
    let filteredRecords = [];
    let currentFilter = 'all';
    let currentPage = 1;
    const recordsPerPage = 10;

    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = 15 + Math.random() * 15 + 's';
        particle.style.width = Math.random() * 6 + 2 + 'px';
        particle.style.height = particle.style.width;
        particlesContainer.appendChild(particle);
      }
    }

    createParticles();

    async function loadRecords() {
      try {
        const response = await fetch(`${API_URL}/records/`, {
          credentials: 'include'
        });

        if (!response.ok) {
          throw new Error('Failed to load records');
        }

        const payload = await response.json();
        allRecords = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.results) ? payload.results : []);

        updateStatistics(allRecords);

        filteredRecords = [...allRecords];
        displayRecords(filteredRecords);
        setupPagination(filteredRecords.length);

        animateTotalCount(filteredRecords.length);
      } catch (error) {
        document.getElementById('recordsBody').innerHTML =
          '<tr><td colspan="5" class="no-records"><i class="fas fa-exclamation-circle"></i><p>Failed to load records</p></td></tr>';
      }
    }

    function updateStatistics(records) {
      const total = records.length;
      const maskCount = records.filter(r => r.status === 'mask').length;
      const noMaskCount = records.filter(r => r.status === 'no_mask').length;
      const compliance = total > 0 ? Math.round((maskCount / total) * 100) : 0;

      animateValue('statTotal', 0, total);
      animateValue('statMask', 0, maskCount);
      animateValue('statNoMask', 0, noMaskCount);

      const complianceEl = document.getElementById('statCompliance');
      animateValue(complianceEl, 0, compliance, '%');
    }

    function animateValue(elementId, start, end, suffix = '') {
      const element = typeof elementId === 'string' ? document.getElementById(elementId) : elementId;
      if (!element) return;

      let current = start;
      const increment = (end - start) / 50;
      const timer = setInterval(() => {
        current += increment;
        if (current >= end) {
          element.textContent = end + suffix;
          clearInterval(timer);
        } else {
          element.textContent = Math.floor(current) + suffix;
        }
      }, 20);
    }

    function animateTotalCount(count) {
      const totalCountEl = document.getElementById('totalCount');
      if (!totalCountEl) return;
      totalCountEl.innerHTML = `<i class="fas fa-chart-pie"></i> ${count} Records`;
    }

    function displayRecords(records) {
      const tbody = document.getElementById('recordsBody');

      if (records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="no-records"><i class="fas fa-inbox"></i><p>No records found</p></td></tr>';
        return;
      }

      const start = (currentPage - 1) * recordsPerPage;
      const end = start + recordsPerPage;
      const paginatedRecords = records.slice(start, end);

      tbody.innerHTML = paginatedRecords.map((record, index) => {
        const date = new Date(record.timestamp);
        const statusClass = record.status === 'mask' ? 'status-mask' : 'status-no-mask';
        const statusText = record.status === 'mask' ? 'Mask Detected' : 'No Mask';
        const statusIcon = record.status === 'mask' ? 'fa-check-circle' : 'fa-exclamation-triangle';
        const confidenceNum = typeof record.confidence === 'number' ? record.confidence : parseFloat(record.confidence);
        const confidenceText = Number.isFinite(confidenceNum) ? confidenceNum.toFixed(2) + '%' : 'N/A';
        const safeConfidence = Number.isFinite(confidenceNum) ? confidenceNum : 0;

        const delay = index * 0.05;

        return `
          <tr style="animation-delay: ${delay}s">
            <td><strong>#${record.id}</strong></td>
            <td>
              <i class="far fa-calendar-alt" style="margin-right: 5px;"></i>
              ${date.toLocaleDateString()}<br>
              <small><i class="far fa-clock" style="margin-right: 5px;"></i>${date.toLocaleTimeString()}</small>
            </td>
            <td><span class="status-badge ${statusClass}"><i class="fas ${statusIcon}"></i> ${statusText}</span></td>
            <td>
              <div class="confidence-cell">
                <span>${confidenceText}</span>
                <div class="confidence-bar">
                  <div class="confidence-fill" style="width: ${safeConfidence}%"></div>
                </div>
              </div>
            </td>
            <td>${record.user ? record.user.username : '<span style="color: #a0aec0;">Guest</span>'}</td>
          </tr>
        `;
      }).join('');

      setupPagination(records.length);
    }

    function setupPagination(totalRecords) {
      const totalPages = Math.ceil(totalRecords / recordsPerPage);
      const pagination = document.getElementById('pagination');

      if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
      }

      let paginationHTML = '';

      paginationHTML += `
        <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
          <i class="fas fa-chevron-left"></i>
        </button>
      `;

      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          paginationHTML += `
            <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
              ${i}
            </button>
          `;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
          paginationHTML += `<button class="page-btn" disabled>...</button>`;
        }
      }

      paginationHTML += `
        <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
          <i class="fas fa-chevron-right"></i>
        </button>
      `;

      pagination.innerHTML = paginationHTML;
    }

    function changePage(page) {
      const totalPages = Math.ceil(filteredRecords.length / recordsPerPage);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      displayRecords(filteredRecords);
      document.querySelector('.table-container').scrollIntoView({ behavior: 'smooth' });
    }

    function filterRecords(filter) {
      currentFilter = filter;
      currentPage = 1;

      let filtered = allRecords;

      if (filter === 'mask') {
        filtered = allRecords.filter(r => r.status === 'mask');
      } else if (filter === 'no_mask') {
        filtered = allRecords.filter(r => r.status === 'no_mask');
      } else if (filter === 'today') {
        const today = new Date().toDateString();
        filtered = allRecords.filter(r => new Date(r.timestamp).toDateString() === today);
      } else if (filter === 'week') {
        const weekAgo = new Date();
        weekAgo.setDate(weekAgo.getDate() - 7);
        filtered = allRecords.filter(r => new Date(r.timestamp) >= weekAgo);
      }

      filteredRecords = filtered;
      displayRecords(filteredRecords);

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.filter === filter) {
          btn.classList.add('active');
        }
      });

      document.querySelector('.table-container').style.animation = 'fadeUp 0.3s';
      setTimeout(() => {
        document.querySelector('.table-container').style.animation = '';
      }, 300);
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => filterRecords(btn.dataset.filter));
    });

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      currentPage = 1;

      if (searchTerm === '') {
        filteredRecords = [...allRecords];
      } else {
        filteredRecords = allRecords.filter(record =>
          record.id.toString().includes(searchTerm) ||
          (record.status && record.status.toLowerCase().includes(searchTerm)) ||
          (record.user && record.user.username && record.user.username.toLowerCase().includes(searchTerm))
        );
      }

      displayRecords(filteredRecords);
      animateTotalCount(filteredRecords.length);
    });

    function showExportModal() {
      document.getElementById('exportModal').style.display = 'flex';
      downloadRecords();
    }

    function closeExportModal() {
      const modal = document.getElementById('exportModal');
      if (modal) modal.style.display = 'none';
    }

    function downloadRecords() {
      window.open(`${API_URL}/records/export_csv/`, '_blank');
      setTimeout(() => {
        closeExportModal();
      }, 800);
    }

    loadRecords();
  </script>
</body>
</html>
