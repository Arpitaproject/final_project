<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join MaskGuard - Create Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .floating-shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      border-radius: 50%;
      animation: floatAround 20s infinite ease-in-out;
    }

    .floating-shape:nth-child(1) {
      width: 600px;
      height: 600px;
      top: -200px;
      right: -200px;
      background: linear-gradient(45deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      animation-delay: 0s;
    }

    .floating-shape:nth-child(2) {
      width: 400px;
      height: 400px;
      bottom: -100px;
      left: -100px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      animation-delay: -5s;
    }

    .floating-shape:nth-child(3) {
      width: 300px;
      height: 300px;
      top: 40%;
      left: 30%;
      background: linear-gradient(225deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      animation-delay: -10s;
    }

    @keyframes floatAround {
      0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      25% { transform: translate(50px, 50px) rotate(90deg) scale(1.1); }
      50% { transform: translate(0, 100px) rotate(180deg) scale(1); }
      75% { transform: translate(-50px, 50px) rotate(270deg) scale(0.9); }
    }

    .particles {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      pointer-events: none;
      animation: particleRise 15s infinite linear;
    }

    @keyframes particleRise {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100px) translateX(100px); opacity: 0; }
    }

    .signup-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      padding: 50px 45px;
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 10;
      animation: containerAppear 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    @keyframes containerAppear {
      0% { opacity: 0; transform: scale(0.9) translateY(30px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    .animated-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      position: relative;
      cursor: pointer;
    }

    .icon-circle {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #4158D0 0%, #C850C0 100%);
      border-radius: 35% 65% 70% 30% / 40% 50% 50% 60%;
      animation: morphShape 8s infinite ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px -10px rgba(65, 88, 208, 0.5);
    }

    @keyframes morphShape {
      0%, 100% { border-radius: 35% 65% 70% 30% / 40% 50% 50% 60%; }
      25% { border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%; }
      50% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; }
      75% { border-radius: 40% 60% 70% 30% / 40% 50% 50% 60%; }
    }

    .icon-circle i {
      font-size: 4rem;
      color: white;
      animation: pulseIcon 3s infinite;
    }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .rotating-ring {
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      border: 2px dashed rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: rotateRing 20s linear infinite;
    }

    .rotating-ring:nth-child(2) {
      top: -20px;
      left: -20px;
      right: -20px;
      bottom: -20px;
      border-color: rgba(255, 255, 255, 0.2);
      animation-duration: 30s;
      animation-direction: reverse;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .logo-section h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #4158D0 0%, #C850C0 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-section p {
      color: #718096;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 22px;
      position: relative;
    }

    .form-group label {
      display: block;
      color: #4a5568;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 0.95rem;
      transform: translateX(5px);
      transition: all 0.3s;
    }

    .input-wrapper {
      position: relative;
      transition: all 0.3s;
    }

    .input-wrapper:hover {
      transform: translateX(5px);
    }

    .input-wrapper i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0aec0;
      transition: all 0.3s;
      z-index: 1;
      font-size: 1.1rem;
    }

    .form-group input {
      width: 100%;
      padding: 16px 20px 16px 50px;
      border: 2px solid rgba(226, 232, 240, 0.6);
      border-radius: 20px;
      font-size: 1rem;
      transition: all 0.3s;
      background: rgba(255, 255, 255, 0.9);
    }

    .form-group input:focus {
      outline: none;
      border-color: #C850C0;
      box-shadow: 0 0 0 4px rgba(200, 80, 192, 0.1);
      transform: scale(1.02);
      background: white;
    }

    .input-highlight {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 3px;
      background: linear-gradient(90deg, #4158D0, #C850C0, #FFCC70);
      transition: all 0.3s;
      transform: translateX(-50%);
      border-radius: 3px;
    }

    .form-group input:focus ~ .input-highlight {
      width: 80%;
    }

    .password-strength {
      margin-top: 8px;
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0;
      transition: all 0.3s;
      border-radius: 2px;
    }

    .strength-text {
      font-size: 0.8rem;
      margin-top: 5px;
      text-align: right;
      color: #718096;
    }

    .signup-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #4158D0 0%, #C850C0 100%);
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 30px -5px rgba(65, 88, 208, 0.5);
    }

    .signup-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .signup-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 20px 40px -5px rgba(65, 88, 208, 0.7);
    }

    .signup-btn:hover::before {
      left: 100%;
    }

    .signup-btn:active {
      transform: translateY(-1px) scale(1);
    }

    .signup-btn i {
      transition: transform 0.3s;
    }

    .signup-btn:hover i {
      transform: rotate(360deg);
    }

    .error-msg {
      background: rgba(254, 215, 215, 0.9);
      backdrop-filter: blur(10px);
      color: #c53030;
      padding: 15px 20px;
      border-radius: 20px;
      margin-bottom: 25px;
      display: none;
      font-size: 0.95rem;
      border-left: 5px solid #c53030;
      animation: slideInError 0.3s ease-out;
      position: relative;
      overflow: hidden;
    }

    @keyframes slideInError {
      0% { opacity: 0; transform: translateX(-20px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .error-msg.show {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .error-msg i {
      font-size: 1.2rem;
    }

    .helper {
      margin-top: 25px;
      text-align: center;
      color: #718096;
      font-size: 1rem;
      padding: 15px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 30px;
      backdrop-filter: blur(5px);
    }

    .helper a {
      color: #C850C0;
      font-weight: 600;
      text-decoration: none;
      position: relative;
      padding: 5px 10px;
      transition: all 0.3s;
    }

    .helper a:hover {
      color: #4158D0;
    }

    .helper a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #4158D0, #C850C0);
      transition: all 0.3s;
      transform: translateX(-50%);
    }

    .helper a:hover::after {
      width: 80%;
    }

    .terms-group {
      margin: 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .terms-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #C850C0;
    }

    .terms-group label {
      color: #4a5568;
      font-size: 0.95rem;
    }

    .terms-group a {
      color: #C850C0;
      text-decoration: none;
    }

    .loading-spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="animated-bg">
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
    <div class="floating-shape"></div>
  </div>

  <div class="particles" id="particles"></div>

  <div class="signup-container">
    <div class="logo-section">
      <div class="animated-icon">
        <div class="icon-circle">
          <i class="fas fa-user-shield"></i>
        </div>
        <div class="rotating-ring"></div>
        <div class="rotating-ring"></div>
      </div>
      <h1>Join MaskGuard</h1>
      <p>Create your secure account</p>
    </div>

    <div class="error-msg" id="errorMsg">
      <i class="fas fa-exclamation-circle"></i>
      <span></span>
    </div>

    <form id="signupForm">
      <div class="form-group">
        <label for="username">
          <i class="fas fa-user-circle"></i> Username
        </label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input type="text" id="username" name="username" placeholder="Choose a username" required>
          <span class="input-highlight"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">
          <i class="fas fa-envelope"></i> Email Address
        </label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" name="email" placeholder="Enter your email (optional)">
          <span class="input-highlight"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">
          <i class="fas fa-key"></i> Password
        </label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="Create a strong password" required>
          <span class="input-highlight"></span>
        </div>
        <div class="password-strength">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <div class="strength-text" id="strengthText">Enter password</div>
      </div>

      <div class="form-group">
        <label for="confirm_password">
          <i class="fas fa-check-circle"></i> Confirm Password
        </label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
          <span class="input-highlight"></span>
        </div>
        <div class="password-match" id="matchIndicator" style="font-size: 0.8rem; margin-top: 5px;"></div>
      </div>

      <div class="terms-group">
        <input type="checkbox" id="terms" required>
        <label for="terms">
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="signup-btn" id="signupBtn">
        <span>Create Account</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <div class="helper">
      <i class="fas fa-question-circle"></i>
      Already have an account?
      <a href="/">Sign In</a>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:8000/api';

    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = 15 + Math.random() * 10 + 's';
        particle.style.width = Math.random() * 8 + 2 + 'px';
        particle.style.height = particle.style.width;
        particlesContainer.appendChild(particle);
      }
    }

    createParticles();

    const password = document.getElementById('password');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');
    const confirmPassword = document.getElementById('confirm_password');
    const matchIndicator = document.getElementById('matchIndicator');

    password.addEventListener('input', checkPasswordStrength);
    confirmPassword.addEventListener('input', checkPasswordMatch);

    function checkPasswordStrength() {
      const val = password.value;
      let strength = 0;

      if (val.length >= 8) strength += 25;
      if (val.match(/[a-z]+/)) strength += 25;
      if (val.match(/[A-Z]+/)) strength += 25;
      if (val.match(/[0-9]+/)) strength += 15;
      if (val.match(/[$@#&!]+/)) strength += 10;

      strengthBar.style.width = strength + '%';

      if (strength < 30) {
        strengthBar.style.background = '#f56565';
        strengthText.textContent = 'Weak password';
        strengthText.style.color = '#f56565';
      } else if (strength < 60) {
        strengthBar.style.background = '#ed8936';
        strengthText.textContent = 'Medium password';
        strengthText.style.color = '#ed8936';
      } else if (strength < 80) {
        strengthBar.style.background = '#48bb78';
        strengthText.textContent = 'Strong password';
        strengthText.style.color = '#48bb78';
      } else {
        strengthBar.style.background = '#38a169';
        strengthText.textContent = 'Very strong password';
        strengthText.style.color = '#38a169';
      }
    }

    function checkPasswordMatch() {
      if (confirmPassword.value.length === 0) {
        matchIndicator.textContent = '';
        return;
      }

      if (password.value === confirmPassword.value) {
        matchIndicator.innerHTML = '<i class="fas fa-check-circle" style="color: #48bb78;"></i> Passwords match';
        matchIndicator.style.color = '#48bb78';
      } else {
        matchIndicator.innerHTML = '<i class="fas fa-times-circle" style="color: #f56565;"></i> Passwords do not match';
        matchIndicator.style.color = '#f56565';
      }
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirm_password').value;
      const terms = document.getElementById('terms').checked;
      const errorMsg = document.getElementById('errorMsg');
      const signupBtn = document.getElementById('signupBtn');

      errorMsg.classList.remove('show');

      if (!terms) {
        errorMsg.querySelector('span').textContent = 'Please accept the Terms of Service';
        errorMsg.classList.add('show');
        return;
      }

      if (password !== confirm_password) {
        errorMsg.querySelector('span').textContent = 'Passwords do not match';
        errorMsg.classList.add('show');
        return;
      }

      signupBtn.innerHTML = '<span class="loading-spinner"></span> Creating Account...';
      signupBtn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/auth/register/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({ username, email, password, confirm_password })
        });

        const data = await response.json();

        if (data.success) {
          signupBtn.innerHTML = '<i class="fas fa-check"></i> Account Created! Redirecting...';
          signupBtn.style.background = 'linear-gradient(135deg, #48bb78 0%, #38a169 100%)';

          createConfetti();

          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } else {
          errorMsg.querySelector('span').textContent = data.error || 'Registration failed';
          errorMsg.classList.add('show');

          signupBtn.innerHTML = '<span>Create Account</span><i class="fas fa-arrow-right"></i>';
          signupBtn.disabled = false;
        }
      } catch (error) {
        errorMsg.querySelector('span').textContent = 'Connection error: ' + error.message;
        errorMsg.classList.add('show');

        signupBtn.innerHTML = '<span>Create Account</span><i class="fas fa-arrow-right"></i>';
        signupBtn.disabled = false;
      }
    });

    function createConfetti() {
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.style.position = 'fixed';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.top = '-10px';
        confetti.style.width = '10px';
        confetti.style.height = '10px';
        confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.borderRadius = '50%';
        confetti.style.pointerEvents = 'none';
        confetti.style.zIndex = '9999';
        confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear`;
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
      }
    }

    const style = document.createElement('style');
    style.textContent = `
      @keyframes fall {
        to {
          transform: translateY(100vh) rotate(360deg);
        }
      }
    `;
    document.head.appendChild(style);

    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', () => {
        input.parentElement.style.transform = 'translateX(8px)';
      });

      input.addEventListener('blur', () => {
        input.parentElement.style.transform = 'translateX(0)';
      });
    });

    let usernameTimeout;
    document.getElementById('username').addEventListener('input', function() {
      clearTimeout(usernameTimeout);
      const username = this.value;

      if (username.length < 3) return;

      usernameTimeout = setTimeout(async () => {
        const wrapper = this.parentElement;
        wrapper.style.borderColor = '#fbbf24';
      }, 500);
    });
  </script>
</body>
</html>
