<!DOCTYPE html>
<html>
<head>
  <title>Test Detection</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #video { width: 640px; height: 480px; border: 3px solid #ccc; }
    #canvas { position: absolute; top: 0; left: 0; }
    .container { position: relative; display: inline-block; }
    button { padding: 10px 20px; margin: 10px; font-size: 16px; }
    #status { margin-top: 20px; font-size: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Test Automatic Detection</h1>
  <div class="container">
    <video id="video" autoplay></video>
    <canvas id="canvas"></canvas>
  </div>
  <br>
  <button onclick="startCamera()">Start Camera</button>
  <button onclick="stopCamera()">Stop Camera</button>
  <div id="status">Status: Not started</div>
  <div id="log"></div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');
    
    let stream = null;
    let interval = null;
    let detectionCount = 0;
    
    function log(msg) {
      console.log(msg);
      logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${msg}</div>`;
    }
    
    async function startCamera() {
      try {
        log('Requesting camera...');
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
          log('Video loaded, starting detection...');
          canvas.width = video.offsetWidth;
          canvas.height = video.offsetHeight;
          
          // Start detection
          setTimeout(() => {
            log('First detection starting...');
            detectMask();
          }, 1000);
          
          interval = setInterval(() => {
            log('Running detection #' + (++detectionCount));
            detectMask();
          }, 2000);
        };
      } catch (error) {
        log('ERROR: ' + error.message);
      }
    }
    
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
      if (interval) {
        clearInterval(interval);
      }
      log('Camera stopped');
      statusDiv.textContent = 'Status: Stopped';
    }
    
    async function detectMask() {
      try {
        log('Capturing frame...');
        
        // Capture frame
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = video.videoWidth;
        tempCanvas.height = video.videoHeight;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(video, 0, 0);
        
        const imageData = tempCanvas.toDataURL('image/jpeg', 0.8);
        log('Image captured, sending to API...');
        
        // Send to backend
        const response = await fetch('http://localhost:8000/api/detect/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ image: imageData })
        });
        
        log('API response status: ' + response.status);
        const result = await response.json();
        log('API result: ' + JSON.stringify(result));
        
        if (result.success) {
          const maskDetected = result.mask_detected;
          const confidence = result.confidence;
          
          // Draw box
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = maskDetected ? '#48bb78' : '#f56565';
          ctx.lineWidth = 8;
          ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
          
          // Update status
          statusDiv.textContent = `Status: ${maskDetected ? 'MASK DETECTED' : 'NO MASK'} (${confidence.toFixed(1)}%)`;
          statusDiv.style.color = maskDetected ? '#48bb78' : '#f56565';
          
          log(`Detection result: ${maskDetected ? 'MASK' : 'NO MASK'} - ${confidence}%`);
        } else {
          log('ERROR: ' + (result.error || 'Unknown error'));
        }
      } catch (error) {
        log('EXCEPTION: ' + error.message);
      }
    }
  </script>
</body>
</html>
